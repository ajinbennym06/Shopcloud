{% extends 'base.html' %}
{% block title %}Login – ShopCloud{% endblock %}
{% block content %}
<div class="container" style="max-width:440px; margin-top:80px;">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h2 class="mb-1 fw-bold">Sign in</h2>
      <p class="text-muted mb-4">Welcome back</p>
      <form method="POST" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
      <hr>
      <p class="text-center mb-0">No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </div>
  </div>
</div>
{% endblock %}
