{% extends 'base.html' %}
{% block title %}Register – ShopCloud{% endblock %}
{% block content %}
<div class="container" style="max-width:460px; margin-top:80px;">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h2 class="mb-1 fw-bold">Create account</h2>
      <p class="text-muted mb-4">Join ShopCloud today</p>
      <form method="POST" novalidate>
        {{ csrf_token() if csrf_token is defined else '' }}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" name="name" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password <small class="text-muted">(min. 8 characters)</small></label>
          <input type="password" name="password" class="form-control" required minlength="8">
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm password</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Create account</button>
      </form>
      <hr>
      <p class="text-center mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}
