{% extends 'admin/base.html' %}
{% block title %}Categories{% endblock %}
{% block admin_content %}
<h3 class="fw-bold mb-4">Categories</h3>
<div class="row g-4" style="max-width:600px">
  <div class="col-12">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <form method="POST" class="d-flex gap-2">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="text" name="name" class="form-control" placeholder="New category name" required>
          <button class="btn btn-primary px-4">Add</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-12">
    <div class="card border-0 shadow-sm">
      <ul class="list-group list-group-flush">
        {% for cat in categories %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ cat.name }}</span>
            <span class="badge bg-secondary rounded-pill">{{ cat.products | length }} products</span>
          </li>
        {% else %}
          <li class="list-group-item text-muted text-center py-4">No categories yet.</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
